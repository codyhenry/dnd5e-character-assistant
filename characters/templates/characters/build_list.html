{% extends 'base.html' %}
{% block content %}
<h1>Character Builds</h1>
<p>
  <a href="{% url 'characters:create' %}">Create build</a> |
  <a href="{% url 'characters:npc_create' %}">Create NPC</a>
</p>
<ul>
  {% for build in object_list %}
    <li><a href="{% url 'characters:detail' build.pk %}">{{ build.name }}</a> ({{ build.build_type }})</li>
  {% empty %}
    <li>No builds yet.</li>
  {% endfor %}
</ul>
{% endblock %}
