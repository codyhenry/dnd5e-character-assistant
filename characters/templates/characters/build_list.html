{% extends 'base.html' %}
{% block content %}
<h1>Character Builds</h1>
<p class="action-links">
  <a href="{% url 'characters:create' %}">Create build</a>
  <a href="{% url 'characters:npc_create' %}">Create NPC</a>
</p>
<ul class="record-list">
  {% for build in object_list %}
  <li>
    <a href="{% url 'characters:detail' build.pk %}" class="record-link">
      <span class="record-title">{{ build.name }}</span>
      <span class="record-meta">{{ build.build_type }} • Created {{ build.created_at|date:"M j, Y" }}</span>
    </a>
  </li>
  {% empty %}
  <li class="record-empty">No builds yet.</li>
  {% endfor %}
</ul>
{% endblock %}
